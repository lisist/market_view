name: Deploy MkDocs
on:
  push:
    branches:
      - main  # 또는 master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install mkdocs mkdocs-material  # 사용하는 테마에 맞게 수정
      - run: mkdocs gh-deploy --force
